<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Blood - Gazaria Blood Donation Organization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        .header {
            background-color: #d9534f;
            color: #fff;
            padding: 1em 0;
            text-align: center;
        }
        .header h1 {
            margin: 0;
        }
        .header nav a {
            color: #fff;
            text-decoration: none;
            padding: 0 15px;
            font-size: 1.1em;
            transition: color 0.3s;
        }
        .header nav a:hover {
            color: #ccc;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
            padding: 2em 0;
        }
        .section {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .section h2 {
            color: #d9534f;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input[type="text"],
        .form-group input[type="tel"],
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
        }
        .btn {
            display: inline-block;
            background: #d9534f;
            color: #fff;
            padding: 12px 25px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background: #c9302c;
        }
        .footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1em 0;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <nav>
            <h1>Gazaria Blood Donation Organization</h1>
            <a href="home.html">Home</a>
            <a href="donate.html">Donate</a>
            <a href="rquest.html">Request Blood</a>
            <a href="about.html">About</a>
        </nav>
    </div>

    <div class="container">
        <div class="section">
            <h2>রক্তের জন্য আবেদন</h2>
            <p>জরুরি প্রয়োজনে রক্তের জন্য নিচের ফর্মটি পূরণ করুন। আমাদের স্বেচ্ছাসেবকরা আপনার সাথে দ্রুত যোগাযোগ করবে।</p>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="patient-name">রোগীর পুরো নাম:</label>
                    <input type="text" id="patient-name" name="patient_name" required>
                </div>
                <div class="form-group">
                    <label for="blood-group">প্রয়োজনীয় রক্তের গ্রুপ:</label>
                    <select id="blood-group" name="blood_group" required>
                        <option value="">নির্বাচন করুন</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="quantity">রক্তের পরিমাণ (ইউনিট):</label>
                    <input type="number" id="quantity" name="quantity" min="1" required>
                </div>
                <div class="form-group">
                    <label for="location">রোগীর বর্তমান ঠিকানা / হাসপাতালের নাম:</label>
                    <input type="text" id="location" name="location" required>
                </div>
                <div class="form-group">
                    <label for="phone">যোগাযোগের ফোন নম্বর:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="message">অন্যান্য তথ্য (ঐচ্ছিক):</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </div>
                <button type="submit" class="btn">আবেদন জমা দিন</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2025 Gazaria Blood Donation Organization. All rights reserved.</p>
    </footer>

</body>
</html>
